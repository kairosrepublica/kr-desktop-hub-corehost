<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KR Trading Clock Prototype v0.5</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="widget">
    <section class="compact-control">
      <strong>Trading Clock</strong>
      <div class="slider-wrap">
        <input id="timeSlider" type="range" min="-24" max="24" step="0.5" value="0" />
        <small id="offsetLabel">Now</small>
      </div>
      <button id="resetButton" type="button">Now</button>
    </section>

    <section id="marketGrid" class="market-grid"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
