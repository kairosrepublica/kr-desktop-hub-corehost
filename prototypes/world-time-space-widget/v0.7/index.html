<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KR World Time-Space Prototype v0.7</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="worldWidget" class="widget" tabindex="0" aria-label="KR World Time-Space Widget">
    <section class="compact-control">
      <div>
        <strong>World Time-Space</strong>
        <span id="localClock">--:--</span>
      </div>
      <div class="slider-wrap">
        <input id="timeSlider" type="range" min="-24" max="24" step="0.5" value="0" />
        <small id="offsetLabel">Now</small>
      </div>
      <button id="resetButton" type="button">Now</button>
    </section>

    <section id="cityGrid" class="city-grid" aria-label="Visible city clocks"></section>

    <section id="contextMenu" class="context-menu" hidden aria-label="World Time-Space context menu">
      <button id="contextAddCity" class="context-item" type="button">Add city...</button>
      <button id="contextRemoveCity" class="context-item context-danger" type="button" hidden>Remove city</button>
    </section>

    <section id="standaloneChooser" class="standalone-overlay" hidden aria-label="Add City chooser">
      <div class="chooser-card">
        <div class="chooser-head">
          <strong>Add city</strong>
          <button id="standaloneChooserClose" type="button">Close</button>
        </div>
        <input id="standaloneChooserSearch" class="chooser-search" type="search" placeholder="Search city or time zone" />
        <div id="standaloneChooserList" class="chooser-list"></div>
        <div id="standaloneChooserLimit" class="chooser-limit"></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
